# Les vérifications du back-office, à chaque envoi sur master et sur chaque
# demande de fusion : types (contre le contrat de la base), style, tests,
# construction.
#
# ⚠️ LES CLÉS SONT FACTICES, ET C'EST VOULU. La construction n'appelle ni Clerk
# ni Supabase ; elle a seulement besoin de clés bien formées. Aucune vraie clé
# n'est confiée à GitHub.
name: Vérifications

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_exemple
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhlbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_exemple
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types (contre le contrat de la base)
        run: npm run typecheck
      - name: Style
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Construction
        run: npm run build
